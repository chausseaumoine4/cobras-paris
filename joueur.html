<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace joueurs · Cobras Paris</title>
    <link rel="icon" type="image/png" href="cobras-logo.png?v=2" />
    <link rel="manifest" href="manifest-player.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="player-page">
    <script>if(location.pathname.endsWith("/joueur.html")) location.replace("joueurs/");</script>
    <main class="player-shell">
      <div class="staff-topbar"><div class="brand staff-brand"><img class="brand-logo" src="cobras-logo.png" alt="Logo Cobras Paris" /><span><b>COBRAS</b><small>ESPACE JOUEURS</small></span></div><button id="playerLogout" class="text-link" hidden>Se déconnecter</button></div>
      <section id="playerLogin" class="staff-login"><p class="kicker">ESPACE JOUEURS</p><h1>COBRA<br /><em>TEAM.</em></h1><p class="admin-muted">Retrouve tes matchs, tes entraînements, tes présences et les discussions de ton équipe.</p><form id="playerLoginForm" class="staff-card" autocomplete="off"><label>Email<input id="playerEmail" type="email" required /></label><label>Mot de passe<input id="playerPassword" type="password" required /></label><button class="button button-primary full" type="submit">Se connecter →</button></form><form id="playerSignupForm" class="staff-card"><h3>Créer mon compte joueur</h3><label>Nom d'utilisateur<input id="signupName" required /></label><label>Email<input id="signupEmail" type="email" required /></label><label>Mot de passe<input id="signupPassword" type="password" minlength="8" required /></label><button class="button button-outline full" type="submit">Créer mon compte</button></form></section>
      <section id="playerDashboard" hidden><div class="dashboard-top"><div><p class="kicker">MON ESPACE</p><h1>COBRA<br /><em>TEAM.</em></h1><p id="playerIdentity" class="admin-muted"></p></div></div><div class="player-tabs"><button class="button button-primary small" data-tab="agenda">Agenda</button><button class="button button-outline small" data-tab="chat">Chat</button></div><div id="agendaTab"><div class="admin-content"><h3>Mes prochains matchs</h3><div id="playerMatches"></div></div><div class="admin-content"><h3>Mes entraînements</h3><div id="playerTrainings"></div></div></div><div id="chatTab" hidden><div class="chat-layout"><aside class="staff-card"><h3>Mes groupes</h3><div id="groupList"></div></aside><section class="staff-card chat-box"><h3 id="chatTitle">Aucune conversation</h3><div id="messageList" class="message-list"></div><form id="messageForm" class="chat-form" hidden><input id="messageInput" required placeholder="Écrire un message…" /><button class="button button-primary small">Envoyer</button></form></section></div></div></section>
    </main>
    <div id="playerToast" class="toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=4"></script><script src="joueur.js?v=1"></script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw-player.js?v=1");</script>
  </body>
</html>
